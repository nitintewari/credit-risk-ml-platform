name: Credit Risk CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check training data
        run: |
          test -f data/raw/credit_risk_dataset.csv

      - name: Train model
        env:
          PYTHONPATH: src
        run: |
          python src/credit_risk/train.py

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          pytest tests/test_api.py -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://credit-risk-ml-platform-urlf.onrender.com
        run: npm run build

      - name: Build Docker image
        run: |
          docker build -t credit-risk-api .

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker tag credit-risk-api ghcr.io/${{ github.repository_owner }}/credit-risk-api:latest
          docker push ghcr.io/${{ github.repository_owner }}/credit-risk-api:latest